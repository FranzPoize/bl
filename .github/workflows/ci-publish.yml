name: Test and publish with uv

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*.*.*"
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest --cov --cov-config pyproject.toml --cov-branch --cov-report=xml --ignore benchmark/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: Benchmark comparison bl vs ak
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install bl
        run: uv pip install -e .

      - name: Install ak
        run: uv pip install git+https://github.com/akretion/ak

      - name: Clean external-src folders
        run: |
          rm -rf benchmark/bl_benchmark/external-src/
          rm -rf benchmark/ak_benchmark/external-src/

      - name: Configure git identity
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@example.com"

      - name: Run bl build
        run: bl build -c ci-spec.yaml -z ci-frz.yml
        working-directory: benchmark/bl_benchmark/

      - name: Run ak build and sparse
        run: ak build -c ci-spec.yaml -f ci-frz.yml -j 5 && ak sparse -c ci-spec.yaml
        working-directory: benchmark/ak_benchmark/

      - name: Compare results
        run: dev_tool/check_diff.sh benchmark/bl_benchmark/external-src benchmark/ak_benchmark/external-src

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --token "$UV_PUBLISH_TOKEN"

