[project]
name = "bl-odoo"
dynamic = ["version"]
description = "A command-line tool for managing Odoo dependencies."
authors = [
  { name="Your Name", email="your.email@example.com" },
]
dependencies = [
    "copier",
    "rich",
    "ruamel-yaml>=0.19.1",
    "typer",
    "xdg-base-dirs>=6.0.2",
]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "ruff",
    "kalong",
    "nest-asyncio>=1.6.0",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.0.0",
]

[project.scripts]
bl = "bl.__main__:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bl"]

[tool.setuptools.package-data]
"bl" = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[tool.coverage.run]
branch = true
include = [
  "bl/*"
]
omit = [
  "__init__.py",
  "__main__.py"
]

[tool.coverage.report]
ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"
